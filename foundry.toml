[profile.default]
src = "arms"
# "." so shared/test/ runs too; lib/ is excluded as a library path
test = "."
script = "arms"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "osaka"
fs_permissions = [{ access = "read", path = "./arms" }]
# nargo/bb drop generated verifier copies here; they are not sources
skip = ["arms/*/circuit/target/**"]

[fmt]
# generated by `bb write_solidity_verifier` -- never hand-edited
ignore = ["arms/*/circuit/target/*.sol", "**/*HonkVerifier.sol"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
