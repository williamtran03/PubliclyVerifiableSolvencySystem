[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./fixtures" }]
optimizer = true
optimizer_runs = 200

[lint]
# Generated by `bb write_solidity_verifier`; not ours to restyle.
ignore = ["contracts/HonkVerifier.sol"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
