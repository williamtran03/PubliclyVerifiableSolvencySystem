name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1
      - run: forge build --sizes
      - run: forge test -vvv

  prover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsx --test prover/*.test.ts prover/kzg/*.test.ts

  # Rebuilds every commitment and proof from scratch and checks the committed
  # fixtures still match, which is what catches the prover and the contracts
  # drifting apart.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx prover/buildTree.ts
      - run: npx tsx script/commit.ts
      - name: The committed fixtures must match what we just rebuilt
        run: git diff --exit-code fixtures/

  # The demo is the integration test: it is the only thing that exercises the
  # contract and the prover against each other on a live chain.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: forge build
      - run: npx tsx script/demo.ts
